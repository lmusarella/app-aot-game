<footer class="app-footer" aria-label="Footer">
    <div class="app-footer__row">
        <div class="app-footer__credits">
            Ideato da Marco Del Monaco, Sviluppato da Luca Musarella
        </div>

        <div class="footer-bars footer-bars--single" role="group" aria-label="Stato Squadra">
            <div class="bar-row mini" id="morale-row">
                <div class="bar-head">
                    <span class="br-label">Morale</span>
                    <span id="morale-val" class="br-val">65%</span>
                </div>
                <div class="bar-track">
                    <button class="bbtn" data-target="morale" data-delta="-1" title="-1%">−</button>
                    <div class="bar morale">
                        <div id="morale-fill" class="fill" style="width:65%"></div>
                    </div>
                    <button class="bbtn" data-target="morale" data-delta="1" title="+1%">+</button>
                </div>
            </div>

            <div class="bar-row mini" id="xp-row">
                <div class="bar-head">
                    <span class="br-label">
                        Exp <span id="lvl-val" class="br-sub">Lv. 1</span>
                    </span>
                    <span id="xp-val" class="br-val">40%</span>
                </div>
                <div class="bar-track">
                    <button class="bbtn" data-target="xp" data-xp="-1" title="-1 XP">−</button>
                    <div class="bar xp">
                        <div id="xp-fill" class="fill" style="width:40%"></div>
                    </div>
                    <button class="bbtn" data-target="xp" data-xp="1" title="+1 XP">+</button>
                </div>
            </div>
        </div>

        <div class="footer-actions" aria-label="Azioni e compagni">
            <button class="footer-action-btn footer-hand-btn" type="button" aria-label="Apri mano di carte" title="Mano">
                <span aria-hidden="true">🃏</span>
            </button>
            <button class="footer-action-btn footer-self-btn" type="button" aria-label="Apri squadra fuori missione"
                title="La tua squadra">
                <img src="assets/units/default.png" alt="Il tuo avatar">
            </button>
            <div class="footer-companions" role="group" aria-label="Compagni">
                <span class="footer-companions-label">Compagni</span>
                <div class="footer-avatars" role="list" aria-label="Giocatori">
                    <!-- popolato via JS -->
                </div>
            </div>
        </div>
    </div>
</footer>
