<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="./manifest.json">
    <title>AOT Companion</title>
    <link rel="stylesheet" href="styles/game.css">
    <link rel="stylesheet" href="styles/screens.css">
    <link rel='stylesheet' href='src/dice-roller/styles.css' />
    <link rel="icon" type="image/png" sizes="40x40" href="assets/img/logo.jpg">

    <!-- iPad/iPhone: icona Home -->
    <link rel="apple-touch-icon" href="assets/img/logo.jpg">
    <!-- Avvio a schermo intero + status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registrato'))
                .catch(err => console.error('SW registration failed:', err));
        });
    }
</script>

<body>

    <!-- SCHERMATA LOGIN -->
    <div id="view-login"></div>

    <!-- SCHERMATA LOBBY -->
    <div id="view-lobby"></div>

    <!-- SCHERMATA STANZA -->
    <div id="view-room"></div>



    <!--<div id="screen-game" class="hidden">-->
    <!-- ===== HEADER minimal ===== -->
    <div id="view-header"></div>


    <!-- ===== MENU LATERALE SINISTRO ===== -->

    <div id="view-leftbar"></div>


    <!-- ===== COLONNA PANCHINE (DESTRA) ===== -->
    <div id="view-rightbar"></div>

    <div id="view-overlays"></div>

    <div id="view-audio"></div>


    <!-- ===== CAMPO ===== -->
    <main>
        <div class="grid-wrapper">
            <div id="hex-grid"></div>
        </div>
    </main>

    <div id="snackbar-region" aria-live="polite" aria-atomic="true"></div>


    <!-- === FAB DOCK === -->
    <div class="fab-dock" aria-label="Azioni rapide">
        <!-- SPAWN -->
        <div id="fab-spawn" class="fab spawn" aria-expanded="false">
            <button class="fab-main spawn" data-commander-only type="button" title="Spawna un gigante">GIGANTI</button>
            <div class="fab-options" aria-hidden="true">
                <button class="fab-option" data-commander-only data-type="Puro" title="Gigante Puro" style="--angle:-70deg">Spawn
                    Puro</button>
                <button class="fab-option" data-commander-only data-type="Anomalo" title="Gigante Anomalo" style="--angle:-45deg">Spawn
                    Anomalo</button>
                <button class="fab-option" data-commander-only data-type="Mutaforma" title="Gigante Mutaforma" style="--angle:45deg">Spawn
                    Mutaforma</button>
                <button class="fab-option" data-commander-only data-type="Casuale" title="Gigante Casuale" style="--angle:70deg">Spawn
                    Evento
                </button>
                <button class="fab-option" data-commander-only data-type="Movimento" title="Movimento" style="--angle:0deg">Movimento
                </button>
            </div>
        </div>
        <!-- EVENTO -->
        <div id="fab-event" class="fab event" aria-expanded="false">
            <button class="fab-main event" data-commander-only type="button" title="Carte">CARTE</button>
            <div class="fab-options" aria-hidden="true">
                <button class="fab-option" data-commander-only data-ev="evento" title="Pesca Evento" style="--angle:-65deg">Pesca
                    Evento <span class="deck-badge" data-deck-badge="event"></span></button>
                <button class="fab-option" data-commander-only data-ev="reshuffle" title="Rimescola gli scarti di tutti i mazzi"
                    style="--angle:-35deg">
                    Rimescola Mazzi
                </button>
                <button class="fab-option" data-commander-only data-ev="showhand" title="Carte in mano" style="--angle:35deg">Carte in
                    mano <span class="deck-badge" data-deck-badge="showhand"></span></button>
                <button class="fab-option" data-commander-only data-ev="consumabile" title="Pesca Consumabile" style="--angle:65deg">Pesca
                    Consumabile <span class="deck-badge" data-deck-badge="consumable"></span> </button>
            </div>
        </div>

        <!-- ARRUOLA -->
        <div id="fab-arruola" class="fab arruola" aria-expanded="false">
            <button class="fab-main arruola" data-commander-only type="button" title="Arruola unità">SQUADRA</button>
            <div class="fab-options" aria-hidden="true">
                <button class="fab-option" data-commander-only data-role="recruit" title="Arruola Reclute" style="--angle:-50deg">Arruola
                    Reclute</button>
                <button class="fab-option" data-commander-only data-role="random-team" title="Squadra casuale" style="--angle:0deg">
                    Squadra casuale
                </button>
                <button class="fab-option" data-commander-only data-role="commander" title="Arruola Comandanti"
                    style="--angle:50deg">Arruola Comandanti</button>
            </div>
        </div>


    </div>

    <!-- ===== FOOTER overlay ===== -->
    <div id="view-footer"></div>

    <div id="view-layout-controls"></div>

    <!-- </div> -->

    <script type="module" src="app.js"></script>

    <script src="libs/three.min.js"></script>
    <script src="libs/cannon.min.js"></script>
    <script src="libs/teal.js"></script>

    <script src="src/dice-roller/dice.js"></script>
    <script src="src/dice-roller/main.js"></script>
</body>

</html>
