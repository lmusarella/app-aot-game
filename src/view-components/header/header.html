<header>
    <div class="topbar">
        <div class="header-left">
            <!-- Logo / Icona -->
            <div class="logo-box">
                <img src="assets/img/logo.jpg" alt="Logo" />
            </div>

            <!-- Brand -->
            <div class="brand-wrap">
                <div class="brand">AOT Companion</div>
                <div class="brand-version">v0.9.0</div>
            </div>

            <!-- Missione + controlli -->
            <div class="center-box">
                <button id="btn-tutorial" class="btn-icon" title="Tutorial" aria-label="Tutorial">
                    ❔
                </button>
                <!-- Missione -->
                <div class="mission-ctrl">
                    <div class="mc-box">
                        <span class="mc-label">Missione</span>
                        <button id="m-dec" class="mc-btn" type="button" title="Missione precedente">−</button>
                        <span id="m-num" class="mc-num">1</span>
                        <button id="m-inc" class="mc-btn" type="button" title="Missione successiva">+</button>
                    </div>
                </div>

                <button id="btn-audio" class="btn-icon" title="Impostazioni audio" aria-label="Impostazioni audio">
                    🎧
                </button>
            </div>
        </div>

        <div class="header-center">
            <div class="header-briefing" aria-live="polite">
                <span class="header-briefing-avatar">
                    <img src="assets/img/comandanti/pixies.png" alt="Erwin Smith" />
                </span>
                <div class="header-briefing-bubble" role="status">
                    <span id="phase-label" class="header-briefing-text">Attesa: in attesa del prossimo ordine.</span>
                </div>
            </div>

            <div id="mission-timer-sticky" class="mission-timer-sticky" aria-live="polite">
                <span class="mission-timer-label">Timer</span>
                <span id="t-time" class="mission-timer-time">00:00</span>
            </div>

            <!-- Turn tracker (a destra) -->
            <div id="turn-tracker" class="turn-tracker">
                <div class="turn-tracker__row">
                    <div class="turn-player-wrap">
                        <span class="turn-label">Turno</span>
                        <span class="turn-player-avatar">
                            <img id="turn-player-avatar" src="assets/img/logo.jpg" alt="" aria-hidden="true" />
                        </span>
                        <div class="turn-player-info">
                            <span id="turn-player" class="turn-player">—</span>
                            <span id="turn-timer" class="turn-timer">—</span>
                        </div>
                    </div>
                    <div class="turn-phase-wrap">
                        <span class="turn-phase-label">Fase</span>
                        <span id="turn-phase" class="turn-phase">—</span>
                    </div>
                </div>
                <div class="turn-progress">
                    <div class="turn-progress-meta">
                        <span class="turn-order">Turno <span id="turn-order">—</span></span>
                        <span id="turn-phase-percent" class="turn-progress-percent">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="header-right">
            <!-- Reset partita (a destra) -->
            <button id="btn-reset-game" class="reset-hdr-btn" title="Reset Partita">
                RESET PARTITA
            </button>
            <button id="btn-leave-room" class="reset-hdr-btn" title="Esci dalla partita">
                ESCI PARTITA
            </button>

            <!-- QUI -->
            <div class="header-user">
                <span class="header-user-avatar" data-role="recruit">
                    <img id="hdr-user-avatar" src="assets/img/logo.jpg" alt="Avatar giocatore" />
                </span>
                <span id="hdr-user-name" class="header-user-name">—</span>
                <button id="hdr-user-menu-toggle" class="header-user-menu-toggle" type="button" aria-label="Apri menu"
                    aria-haspopup="true" aria-expanded="false">
                    ☰
                </button>
                <div id="hdr-user-menu" class="header-user-menu" role="menu" hidden>
                    <button class="header-user-menu-item" type="button" data-action="audio" role="menuitem">
                        <span class="menu-icon" aria-hidden="true">🎧</span>
                        <span class="menu-label">Impostazioni audio</span>
                    </button>
                    <button class="header-user-menu-item" type="button" data-action="tutorial" role="menuitem">
                        <span class="menu-icon" aria-hidden="true">🧭</span>
                        <span class="menu-label">Tutorial</span>
                    </button>
                    <button class="header-user-menu-item" type="button" data-action="leave" role="menuitem">
                        <span class="menu-icon" aria-hidden="true">🚪</span>
                        <span class="menu-label">Esci partita</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
